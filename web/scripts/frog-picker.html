<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>tode — pick a frog</title>
<style>
  :root {
    --bg: #0c0c0d;
    --panel: #121214;
    --panel2: #17171a;
    --border: #26262a;
    --text: #ededf0;
    --muted: #82828c;
    --faint: #5a5a63;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    padding: 18px 28px;
    background: rgba(12,12,13,.9); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  h1 { margin: 0; font: 600 15px/1 var(--mono); letter-spacing: -.01em; }
  .hint { color: var(--faint); font-size: 12px; }
  .hint b { color: var(--muted); font-weight: 500; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 20px;
    padding: 24px 28px 80px;
  }
  .card {
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    overflow: hidden;
  }
  .card.missing { opacity: .45; }
  .cap {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--panel2);
  }
  .num {
    font: 600 12px/1 var(--mono);
    padding: 4px 7px; border-radius: 4px;
    background: #26262a; color: var(--text);
  }
  .style { font-size: 12.5px; color: var(--muted); }
  .shot { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; background: #000; }
  .shot.light { background: #fbfbfa; }

  /* the two backgrounds side by side, since the site has a light mode */
  .duo { display: grid; grid-template-columns: 1fr 1fr; }
  .duo > div { position: relative; }
  .duo > div + div { border-left: 1px solid var(--border); }

  /* size tests — this is what decides a favicon */
  .sizes {
    display: flex; align-items: center; gap: 18px;
    padding: 12px; border-top: 1px solid var(--border);
    background: var(--panel2);
  }
  .sizes .lab { font: 10px/1 var(--mono); color: var(--faint); }
  .sizes img { image-rendering: auto; display: block; border-radius: 3px; }
  .s16 { width: 16px; height: 16px; }
  .s24 { width: 24px; height: 24px; }
  .s32 { width: 32px; height: 32px; }
  .s48 { width: 48px; height: 48px; }
  .chip {
    margin-left: auto; display: flex; align-items: center; gap: 8px;
    padding: 4px 9px 4px 6px; border: 1px solid var(--border);
    border-radius: 999px; background: var(--bg);
  }
  .chip img { width: 18px; height: 18px; }
  .chip span { font: 12px/1 var(--mono); }
  .empty { padding: 60px 12px; text-align: center; color: var(--faint); font: 12px/1 var(--mono); }
</style>
</head>
<body>
<header>
  <h1>tode — pick a frog</h1>
  <span class="hint">
    ten styles, same brief · each shown on <b>dark</b> and <b>light</b>, then at
    favicon sizes · tell me the <b>number</b>
  </span>
</header>

<div class="grid" id="grid"></div>

<script>
/* an array, not an object — "10" is a canonical array index and would sort
   itself to the front of an object's keys */
const STYLES = [
  ["01", "flat minimal vector"],
  ["02", "monoline outline"],
  ["03", "pixel art"],
  ["04", "terminal / ASCII glyph"],
  ["05", "bauhaus geometric"],
  ["06", "CRT phosphor"],
  ["07", "glossy sticker"],
  ["08", "woodcut stamp"],
  ["09", "low-poly origami"],
  ["10", "hand-drawn ink"],
];

const grid = document.getElementById("grid");

for (const [n, style] of STYLES) {
  const src = `../public/frogs/frog-${n}.png?v=${Date.now()}`;
  // background keyed out, so the light half shows how it lands in light mode
  const cut = `../public/frogs/cut-${n}.png?v=${Date.now()}`;
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <div class="cap">
      <span class="num">${n}</span>
      <span class="style">${style}</span>
    </div>
    <div class="duo">
      <div><img class="shot" src="${src}" alt="frog ${n} on dark"></div>
      <div><img class="shot light" src="${cut}" alt="frog ${n} on light"></div>
    </div>
    <div class="sizes">
      <span class="lab">16</span><img class="s16" src="${src}" alt="">
      <span class="lab">24</span><img class="s24" src="${src}" alt="">
      <span class="lab">32</span><img class="s32" src="${src}" alt="">
      <span class="lab">48</span><img class="s48" src="${src}" alt="">
      <span class="chip"><img src="${cut}" alt=""><span>tode</span></span>
    </div>`;
  // a style that never produced a file should read as absent, not as a broken card
  card.querySelectorAll("img").forEach((img) => {
    img.addEventListener("error", () => {
      card.classList.add("missing");
      const duo = card.querySelector(".duo");
      if (duo) duo.outerHTML = '<div class="empty">no image generated</div>';
    }, { once: true });
  });
  grid.appendChild(card);
}
</script>
</body>
</html>
