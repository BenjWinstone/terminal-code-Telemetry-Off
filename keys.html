<!doctype html>
<html>
<head><meta charset="utf-8"><title>keys</title>
<style>
  :root { --ok:#48c78e; --bad:#f2555a; --dim:#6b7484; --acc:#5d9cff; }
  html,body{margin:0;height:100%;background:#0d0f13;color:#e6e9ef;
    font:14px ui-monospace,Menlo,monospace;overflow:hidden}
  .frame{position:fixed;inset:0;border:4px solid #ff00d0;box-sizing:border-box;pointer-events:none}
  .wrap{height:100%;display:flex;flex-direction:column;padding:18px;box-sizing:border-box;gap:12px}
  h1{font-size:15px;margin:0;color:var(--dim);font-weight:600;letter-spacing:.1em;text-transform:uppercase}
  .last{font-size:26px;font-weight:600;min-height:34px;color:var(--acc)}
  .mods{display:flex;gap:6px;flex-wrap:wrap}
  .m{padding:3px 9px;border-radius:5px;border:1px solid #232833;color:var(--dim);font-size:12px}
  .m.on{background:rgba(93,156,255,.16);color:var(--acc);border-color:var(--acc)}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;color:var(--dim);font-size:10.5px;text-transform:uppercase;
    letter-spacing:.08em;padding:5px 8px;border-bottom:1px solid #232833}
  td{padding:5px 8px;border-bottom:1px solid #1b1f27;color:#a8b0bf}
  .pass{color:var(--ok);font-weight:600}
  .wait{color:var(--dim)}
  .log{flex:1;overflow:auto;font-size:12px;color:var(--dim);
    border-top:1px solid #232833;padding-top:8px}
  .log div{padding:1px 0}
</style></head>
<body>
<div class="frame"></div>
<div class="wrap">
  <h1>what the page receives</h1>
  <div class="last" id="last">press something</div>
  <div class="mods">
    <span class="m" id="m-ctrl">ctrl</span>
    <span class="m" id="m-meta">meta / cmd</span>
    <span class="m" id="m-alt">alt</span>
    <span class="m" id="m-shift">shift</span>
  </div>
  <h1>checks</h1>
  <table>
    <thead><tr><th>press</th><th>page should see</th><th>result</th></tr></thead>
    <tbody id="checks"></tbody>
  </table>
  <div class="log" id="log"></div>
</div>
<script>
  const CHECKS = [
    { id:'cmdp',  press:'cmd + p',      want:'ctrl+p',  test:e=>e.key==='p'&&e.ctrlKey&&!e.metaKey },
    { id:'cmdb',  press:'cmd + b',      want:'ctrl+b',  test:e=>e.key==='b'&&e.ctrlKey&&!e.metaKey },
    { id:'cmdsp', press:'cmd+shift+p',  want:'ctrl+shift+p', test:e=>e.key==='P'&&e.ctrlKey&&e.shiftKey&&!e.metaKey },
    { id:'ctrlc', press:'ctrl + c',     want:'ctrl+c reaches page (not quit)', test:e=>e.key==='c'&&e.ctrlKey },
    { id:'ctrla', press:'ctrl + a',     want:'ctrl+a reaches page',  test:e=>e.key==='a'&&e.ctrlKey },
    { id:'cmdv',  press:'cmd + v',      want:'meta+v (kept for native paste)', test:e=>e.key==='v'&&e.metaKey&&!e.ctrlKey },
    { id:'cmdl',  press:'cmd + ←', want:'meta+ArrowLeft (kept)', test:e=>e.key==='ArrowLeft'&&e.metaKey&&!e.ctrlKey },
    { id:'f12',   press:'f12',          want:'f12 reaches page', test:e=>e.key==='F12' },
    { id:'cmdt',  press:'cmd + t',      want:'ctrl+t reaches page', test:e=>e.key==='t'&&e.ctrlKey&&!e.metaKey },
  ];
  const tbody = document.getElementById('checks');
  for (const c of CHECKS) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${c.press}</td><td>${c.want}</td><td class="wait" id="r-${c.id}">waiting</td>`;
    tbody.appendChild(tr);
  }
  const log = document.getElementById('log');
  const describe = e => [e.ctrlKey&&'ctrl', e.metaKey&&'meta', e.altKey&&'alt',
    e.shiftKey&&'shift'].filter(Boolean).concat(JSON.stringify(e.key)).join(' + ');
  addEventListener('keydown', e => {
    e.preventDefault();
    document.getElementById('last').textContent = describe(e);
    for (const k of ['ctrl','meta','alt','shift'])
      document.getElementById('m-'+k).classList.toggle('on', e[k+'Key']);
    for (const c of CHECKS) {
      if (c.test(e)) {
        const cell = document.getElementById('r-'+c.id);
        cell.textContent = 'pass'; cell.className = 'pass';
      }
    }
    const line = document.createElement('div');
    line.textContent = describe(e) + '   code=' + e.code;
    log.prepend(line);
    while (log.children.length > 40) log.lastChild.remove();
  }, true);
</script>
</body>
</html>
